<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Somil Athole</title>
  <desc id="d">Full-stack engineer building API security tooling, browser extensions and GenAI products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E2A40" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-28}}
      @media (prefers-reduced-motion:reduce){.cursor,.pulse,.flow{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- left: identity -->
  <text x="64" y="92" class="mono" font-size="16" fill="#8892B0">~/somil14 $ whoami</text>
  <text x="64" y="160" class="sans" font-size="58" font-weight="700" fill="#E6EDF3">Somil Athole</text>
  <text x="64" y="204" class="sans" font-size="22" font-weight="600" fill="url(#accent)">Full-Stack Engineer · API Security · GenAI</text>
  <text x="64" y="244" class="sans" font-size="17" fill="#8892B0">Shipping security SaaS, browser extensions and</text>
  <text x="64" y="268" class="sans" font-size="17" fill="#8892B0">product UIs end to end, from capture to dashboard.</text>
  <text x="64" y="316" class="mono" font-size="15" fill="#00D4FF">$ npm run ship</text>
  <rect class="cursor" x="196" y="303" width="9" height="17" fill="#E6EDF3"/>

  <!-- right: capture → analyze → harden pipeline -->
  <g transform="translate(720 70)">
    <rect width="420" height="230" rx="14" fill="#0D1626" stroke="#22314D"/>
    <circle cx="22" cy="20" r="5" fill="#FF5F57"/>
    <circle cx="40" cy="20" r="5" fill="#FEBC2E"/>
    <circle cx="58" cy="20" r="5" fill="#28C840"/>
    <text x="400" y="25" text-anchor="end" class="mono" font-size="12" fill="#5B6B88">api-traffic.har</text>

    <g class="mono" font-size="13">
      <rect x="22" y="56" width="104" height="44" rx="8" fill="#10233A" stroke="#00D4FF"/>
      <text x="74" y="83" text-anchor="middle" fill="#E6EDF3">capture</text>
      <rect x="158" y="56" width="104" height="44" rx="8" fill="#16183A" stroke="#7C3AED"/>
      <text x="210" y="83" text-anchor="middle" fill="#E6EDF3">analyze</text>
      <rect x="294" y="56" width="104" height="44" rx="8" fill="#0F2A22" stroke="#28C840"/>
      <text x="346" y="83" text-anchor="middle" fill="#E6EDF3">harden</text>
      <path class="flow" d="M126 78H158M262 78H294" stroke="#5B6B88" stroke-width="2" fill="none"/>
    </g>

    <g class="mono" font-size="12.5">
      <text x="22" y="140" fill="#5B6B88">GET  /v2/orders</text>
      <text x="398" y="140" text-anchor="end" fill="#28C840">200 · schema ok</text>
      <text x="22" y="166" fill="#5B6B88">POST /v1/auth/refresh</text>
      <text x="398" y="166" text-anchor="end" fill="#FEBC2E">JWT exposed</text>
      <text x="22" y="192" fill="#5B6B88">GET  /internal/users</text>
      <text x="398" y="192" text-anchor="end" fill="#FF5F57" class="pulse">shadow API</text>
      <line x1="22" y1="208" x2="398" y2="208" stroke="#1E2A40"/>
    </g>
  </g>
</svg>
